services:
  mysql:
    image: mysql:8.0
    container_name: siprabu_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: siprabu_root_pass
      MYSQL_DATABASE: siprabu_db
      MYSQL_USER: siprabu_user
      MYSQL_PASSWORD: siprabu_pass
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
      - ./siprabu_siap_phpmyadmin.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psiprabu_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 15

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: siprabu_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: siprabu_root_pass
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
